
name: PIKE-IAC Windows Deployment With SelfHosted

on:
  workflow_dispatch:
    inputs:
      deploy_resources:
        description: 'Deploy Azure resources?'
        required: true
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Validate and Deploy Azure Infrastructure
    runs-on: [self-hosted, Windows, X64, pike]

    defaults:
      run:
        shell: powershell

    steps:
      # --------------------------------------------
      # 1. CHECKOUT SOURCE CODE
      # --------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------
      # 2. DISCOVER INSTALLED TOOLS
      # --------------------------------------------
      - name: Discover and configure installed tools
        run: |
          $ErrorActionPreference = 'Stop'

          function Add-RunnerPath {
            param([string]$PathToAdd)

            if (-not (Test-Path -LiteralPath $PathToAdd -PathType Container)) {
              return
            }

            if (($env:PATH -split ';') -notcontains $PathToAdd) {
              $env:PATH = "$PathToAdd;$env:PATH"
            }

            if ($env:GITHUB_PATH) {
              $encoding = New-Object System.Text.UTF8Encoding($false)
              [System.IO.File]::AppendAllText(
                $env:GITHUB_PATH,
                "$PathToAdd`n",
                $encoding
              )
            }

            Write-Host "Added to PATH: $PathToAdd"
          }

          Write-Host 'Discovering installed tools on Windows runner...'

          # Git
          $gitCandidates = @(
            'C:\Program Files\Git\cmd',
            'C:\Program Files\Git\bin',
            'C:\Program Files (x86)\Git\cmd'
          )

          # Azure CLI
          $azCandidates = @(
            'C:\Program Files\Microsoft SDKs\Azure\CLI2\wbin',
            'C:\Program Files (x86)\Microsoft SDKs\Azure\CLI2\wbin'
          )

          # Python
          $pythonCandidates = @(
            'C:\Python312',
            'C:\Python311',
            'C:\Program Files\Python312',
            'C:\Program Files\Python311',
            'C:\Program Files\Python312\Scripts',
            'C:\Program Files\Python311\Scripts'
          )

          # jq
          $jqCandidates = @(
            'C:\Program Files\jq',
            'C:\ProgramData\chocolatey\bin',
            'C:\tools',
            'C:\Program Files\Git\usr\bin',
            'C:\Users\azureuser\AppData\Local\Microsoft\WinGet\Links',
            'C:\Users\azureuser\scoop\shims'
          )

          # Discover user profile locations
          $profiles = Get-ChildItem 'C:\Users' -Directory -ErrorAction SilentlyContinue

          foreach ($profile in $profiles) {
            $pythonRoot = Join-Path $profile.FullName 'AppData\Local\Programs\Python'

            if (Test-Path $pythonRoot) {
              Get-ChildItem $pythonRoot -Directory -ErrorAction SilentlyContinue |
                ForEach-Object {
                  $pythonCandidates += $_.FullName
                  $pythonCandidates += (Join-Path $_.FullName 'Scripts')
                }
            }

            $jqCandidates += (Join-Path $profile.FullName 'AppData\Local\Microsoft\WinGet\Links')
            $jqCandidates += (Join-Path $profile.FullName 'scoop\shims')
            $azCandidates += (Join-Path $profile.FullName 'AppData\Local\Programs\Microsoft SDKs\Azure\CLI2\wbin')
          }

          foreach ($candidate in $gitCandidates) {
            Add-RunnerPath $candidate
          }

          foreach ($candidate in $azCandidates) {
            Add-RunnerPath $candidate
          }

          foreach ($candidate in $pythonCandidates) {
            Add-RunnerPath $candidate
          }

          foreach ($candidate in $jqCandidates) {
            Add-RunnerPath $candidate
          }

          # Verify Git
          $git = Get-Command git.exe -ErrorAction SilentlyContinue

          if ($git) {
            Write-Host "Git: $($git.Source)"
            git --version
          }
          else {
            Write-Warning 'Git was not discovered. Checkout has already completed, so Git is not required by deployment steps.'
          }

          # Verify Azure CLI
          $az = Get-Command az.cmd -ErrorAction SilentlyContinue

          if (-not $az) {
            $az = Get-Command az -ErrorAction SilentlyContinue
          }

          if (-not $az) {
            throw 'Azure CLI was not found. Install Azure CLI on the runner machine and rerun the workflow.'
          }

          Write-Host "Azure CLI: $($az.Source)"
          az version

          # Verify Python
          $python = Get-Command python.exe -ErrorAction SilentlyContinue

          if (-not $python) {
            $python = Get-Command python -ErrorAction SilentlyContinue
          }

          if (-not $python) {
            throw 'Python was not found. Install Python 3.10 or later on the runner machine.'
          }

          Write-Host "Python: $($python.Source)"
          python --version

          # Bootstrap pip if required
          python -m pip --version

          if ($LASTEXITCODE -ne 0) {
            Write-Host 'Bootstrapping pip...'
            python -m ensurepip --upgrade

            if ($LASTEXITCODE -ne 0) {
              throw 'Unable to bootstrap pip.'
            }
          }

          # Verify jq
          $jq = Get-Command jq.exe -ErrorAction SilentlyContinue

          if (-not $jq) {
            $jq = Get-Command jq -ErrorAction SilentlyContinue
          }

          if (-not $jq) {
            throw 'jq was not found. Install jq on the runner machine.'
          }

          Write-Host "jq: $($jq.Source)"
          jq --version

          # Install yamllint if missing
          python -c 'import yamllint' 2>$null

          if ($LASTEXITCODE -ne 0) {
            Write-Host 'Installing yamllint for the runner user...'
            python -m pip install --user yamllint

            if ($LASTEXITCODE -ne 0) {
              throw 'Failed to install yamllint.'
            }

            $pythonUserBase = python -m site --user-base

            if ($LASTEXITCODE -eq 0 -and $pythonUserBase) {
              Add-RunnerPath (Join-Path $pythonUserBase.Trim() 'Scripts')
            }
          }

          # Install and verify Bicep
          Write-Host 'Checking Bicep CLI...'
          az bicep install

          if ($LASTEXITCODE -ne 0) {
            throw 'Bicep installation failed.'
          }

          az bicep version

          if ($LASTEXITCODE -ne 0) {
            throw 'Bicep CLI is not available.'
          }

          Write-Host 'All required tools are ready.'

      # --------------------------------------------
      # 3. VALIDATE BICEP FILES
      # --------------------------------------------
      - name: Build and lint Bicep files
        run: |
          $ErrorActionPreference = 'Stop'

          $bicepFiles = Get-ChildItem -Path '.' -Recurse -File -Filter '*.bicep' |
            Where-Object {
              $_.FullName -notmatch '[\\/]\.git[\\/]'
            }

          if (-not $bicepFiles) {
            throw 'No Bicep files were found.'
          }

          foreach ($file in $bicepFiles) {
            Write-Host "Building Bicep: $($file.FullName)"

            az bicep build --file $file.FullName

            if ($LASTEXITCODE -ne 0) {
              throw "Bicep build failed: $($file.FullName)"
            }

            Write-Host "Linting Bicep: $($file.FullName)"

            az bicep lint --file $file.FullName

            if ($LASTEXITCODE -ne 0) {
              throw "Bicep lint failed: $($file.FullName)"
            }
          }

          Write-Host 'Bicep validation completed.'

      # --------------------------------------------
      # 4. VALIDATE JSON FILES
      # --------------------------------------------
      - name: Validate JSON files
        run: |
          $ErrorActionPreference = 'Stop'

          $pythonExe = (Get-Command python.exe -ErrorAction Stop).Source

          $jsonFiles = Get-ChildItem -Path '.' -Recurse -File -Filter '*.json' |
            Where-Object {
              $_.FullName -notmatch '[\\/]\.git[\\/]' -and
              $_.FullName -notmatch '[\\/]\.generated-parameters[\\/]'
            }

          foreach ($file in $jsonFiles) {
            Write-Host "Checking JSON: $($file.FullName)"

            # Pass the path through an environment variable.
            # This avoids PowerShell/Python quote escaping issues.
            $env:JSON_FILE = $file.FullName

            & $pythonExe -c 'import json, os; json.load(open(os.environ["JSON_FILE"], encoding="utf-8")); print("Valid JSON")'

            if ($LASTEXITCODE -ne 0) {
              throw "Invalid JSON: $($file.FullName)"
            }

            Remove-Item Env:\JSON_FILE -ErrorAction SilentlyContinue
          }

          Write-Host 'All JSON files are valid.'

      # --------------------------------------------
      # 5. LINT GITHUB ACTIONS YAML
      # --------------------------------------------
      - name: Lint GitHub Actions YAML
        run: |
          $ErrorActionPreference = 'Stop'

          python -m yamllint -d relaxed .github/workflows/

          if ($LASTEXITCODE -ne 0) {
            throw 'GitHub Actions YAML lint failed.'
          }

      # --------------------------------------------
      # 6. GENERATE PARAMETERS FROM input.json
      # --------------------------------------------
      - name: Generate module parameters
        id: config
        run: |
          $ErrorActionPreference = 'Stop'

          foreach ($secretName in @(
            'AZURE_CLIENT_ID',
            'AZURE_TENANT_ID',
            'AZURE_SUBSCRIPTION_ID'
          )) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($secretName))) {
              throw "Required GitHub secret '$secretName' is missing."
            }
          }

          New-Item -ItemType Directory -Force -Path '.generated-parameters' | Out-Null

          @'
          import json
          import os
          import sys
          from pathlib import Path

          input_file = Path("input.json")
          output_dir = Path(".generated-parameters")
          output_dir.mkdir(exist_ok=True)

          with input_file.open("r", encoding="utf-8") as f:
              config = json.load(f)

          if not isinstance(config, dict):
              raise ValueError("input.json must contain a JSON object")

          deployment = config.get("deployment", {})
          deployment_plan = config.get("deploymentPlan", {})
          landing_zones = config.get("landingZones", {})

          if not isinstance(landing_zones, dict):
              raise ValueError("landingZones must be a JSON object")

          if not isinstance(deployment_plan, dict):
              raise ValueError("deploymentPlan must be a JSON object")

          module_map = {
              "resourceGroups": "resourcegroup",
              "nsgs": "nsg",
              "routeTables": "routetable",
              "vnets": "vnet",
              "subnets": "subnet",
              "applicationGatewaySubnets": "applicationGatewaySubnet",
              "applicationGateways": "applicationGateway",
              "loadBalancers": "lb",
              "keyVaults": "keyvault",
              "storageAccounts": "storageAccount",
              "sqlDatabases": "sql",
              "openAiServices": "openai",
              "vms": "vm",
          }

          generated = {}

          for category, module_name in module_map.items():
              items = landing_zones.get(category, [])

              if items is None:
                  items = []

              if not isinstance(items, list):
                  raise ValueError(
                      f"landingZones.{category} must be an array"
                  )

              plan = deployment_plan.get(category, "skip")

              if isinstance(plan, dict):
                  plan = plan.get("action", "skip")

              plan = str(plan).strip().lower()

              if plan not in ("create", "skip"):
                  raise ValueError(
                      f"Unsupported deploymentPlan.{category}: {plan}"
                  )

              if plan == "skip" or not items:
                  continue

              for index, item in enumerate(items):
                  if not isinstance(item, dict):
                      raise ValueError(
                          f"landingZones.{category}[{index}] must be an object"
                      )

                  output_file = output_dir / f"{module_name}-{index}.parameters.json"

                  parameter_content = {
                      "$schema": "https://schema.management.azure.com/schemas/2019-04-01/deploymentParameters.json#",
                      "contentVersion": "1.0.0.0",
                      "parameters": {
                          key: {"value": value}
                          for key, value in item.items()
                      }
                  }

                  with output_file.open("w", encoding="utf-8") as f:
                      json.dump(parameter_content, f, indent=2)

                  generated.setdefault(module_name, []).append(
                      str(output_file).replace("\\", "/")
                  )

          with (output_dir / "deployment-map.json").open("w", encoding="utf-8") as f:
              json.dump(generated, f, indent=2)

          print(json.dumps(generated, indent=2))
          '@ | Set-Content -Path '.generated-parameters\generate.py' -Encoding UTF8

          python '.generated-parameters\generate.py'

          if ($LASTEXITCODE -ne 0) {
            throw 'Parameter generation failed.'
          }

          $config = Get-Content 'input.json' -Raw | ConvertFrom-Json

          $deployResources = '${{ inputs.deploy_resources }}'

          "deploy_resources=$deployResources" >> $env:GITHUB_OUTPUT

          Write-Host 'Parameter generation completed.'

      # --------------------------------------------
      # 7. AZURE LOGIN
      # --------------------------------------------
      - name: Azure Login using OIDC
        if: steps.config.outputs.deploy_resources == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # --------------------------------------------
      # 8. VERIFY SUBSCRIPTION
      # --------------------------------------------
      - name: Verify Azure subscription
        if: steps.config.outputs.deploy_resources == 'true'
        run: |
          $ErrorActionPreference = 'Stop'

          $expectedSubscription = $env:AZURE_SUBSCRIPTION_ID

          $currentSubscription = az account show --query id -o tsv

          if ($LASTEXITCODE -ne 0) {
            throw 'Unable to retrieve the current Azure subscription.'
          }

          if ($currentSubscription.Trim() -ne $expectedSubscription) {
            throw "Subscription mismatch. Expected $expectedSubscription but got $currentSubscription"
          }

          az account show --output table

      # --------------------------------------------
      # 9. PRE-DEPLOYMENT VALIDATION
      # --------------------------------------------
      - name: Validate Azure deployment prerequisites
        if: steps.config.outputs.deploy_resources == 'true'
        run: |
          $ErrorActionPreference = 'Stop'

          $config = Get-Content 'input.json' -Raw | ConvertFrom-Json

          $subscription = $config.subscription
          $deployment = $config.deployment
          $deploymentPlan = $config.deploymentPlan
          $landingZones = $config.landingZones

          $location = $deployment.location
          $resourceGroupName = $deployment.resourceGroupName

          if ([string]::IsNullOrWhiteSpace($resourceGroupName)) {
            throw 'deployment.resourceGroupName is missing in input.json.'
          }

          Write-Host "Target resource group: $resourceGroupName"
          Write-Host "Target location: $location"

          $rgAction = [string]$deploymentPlan.resourceGroups

          if ($rgAction -eq 'create') {
            Write-Host 'Resource Group will be created by the deployment.'
          }
          else {
            $rgExists = az group exists --name $resourceGroupName

            if ($LASTEXITCODE -ne 0) {
              throw 'Unable to check Resource Group existence.'
            }

            if ($rgExists.Trim() -ne 'true') {
              throw "Resource Group '$resourceGroupName' does not exist. Set deploymentPlan.resourceGroups to create."
            }
          }

          # Key Vault name and soft-delete validation
          if ([string]$deploymentPlan.keyVaults -eq 'create') {
            foreach ($kv in $landingZones.keyVaults) {
              $kvName = $kv.name

              if ([string]::IsNullOrWhiteSpace($kvName)) {
                throw 'A Key Vault name is missing in input.json.'
              }

              $activeKv = az keyvault show --name $kvName --query name -o tsv 2>$null

              if ($LASTEXITCODE -eq 0 -and $activeKv.Trim() -eq $kvName) {
                throw "Key Vault '$kvName' already exists."
              }

              $deletedKv = az keyvault list-deleted --query "[?name=='$kvName'].name" -o tsv 2>$null

              if ($LASTEXITCODE -eq 0 -and $deletedKv) {
                throw "Key Vault '$kvName' is soft-deleted. Recover or purge it before deployment."
              }
            }
          }

          # Azure OpenAI account and custom subdomain validation
          if ([string]$deploymentPlan.openAiServices -eq 'create') {
            foreach ($openAi in $landingZones.openAiServices) {
              $accountName = $openAi.name
              $customSubdomain = $openAi.customSubDomainName

              if ([string]::IsNullOrWhiteSpace($accountName)) {
                throw 'Azure OpenAI account name is missing.'
              }

              $existingAccount = az cognitiveservices account list `
                --query "[?name=='$accountName'].name" -o tsv

              if ($LASTEXITCODE -ne 0) {
                throw 'Unable to check existing Cognitive Services accounts.'
              }

              if ($existingAccount) {
                throw "Azure AI account '$accountName' already exists."
              }

              if (-not [string]::IsNullOrWhiteSpace($customSubdomain)) {
                $subdomainOwner = az cognitiveservices account list `
                  --query "[?properties.customSubDomainName=='$customSubdomain'].name" -o tsv

                if ($LASTEXITCODE -ne 0) {
                  throw 'Unable to check Azure AI custom subdomain availability.'
                }

                if ($subdomainOwner) {
                  throw "Azure AI custom subdomain '$customSubdomain' is already in use."
                }
              }
            }
          }

          Write-Host 'Azure pre-deployment checks completed.'

      # --------------------------------------------
      # 10. RESOURCE GROUP DEPLOYMENT
      # --------------------------------------------
      - name: Deploy Resource Group
        if: steps.config.outputs.deploy_resources == 'true'
        run: |
          $ErrorActionPreference = 'Stop'

          $config = Get-Content 'input.json' -Raw | ConvertFrom-Json

          if ([string]$config.deploymentPlan.resourceGroups -ne 'create') {
            Write-Host 'Resource Group deployment skipped.'
            exit 0
          }

          $resourceGroupParameters = $config.landingZones.resourceGroups

          if (-not $resourceGroupParameters -or $resourceGroupParameters.Count -eq 0) {
            throw 'No Resource Group configuration found in input.json.'
          }

          foreach ($rg in $resourceGroupParameters) {
            $rgName = $rg.name
            $location = $rg.location

            if ([string]::IsNullOrWhiteSpace($rgName)) {
              throw 'Resource Group name is missing.'
            }

            if ([string]::IsNullOrWhiteSpace($location)) {
              $location = $config.deployment.location
            }

            Write-Host "Creating Resource Group: $rgName"

            az group create `
              --name $rgName `
              --location $location `
              --output table

            if ($LASTEXITCODE -ne 0) {
              throw "Resource Group deployment failed: $rgName"
            }
          }

      # --------------------------------------------
      # 11. DEPLOY BICEP MODULES
      # --------------------------------------------
      - name: Deploy infrastructure modules
        if: steps.config.outputs.deploy_resources == 'true'
        run: |
          $ErrorActionPreference = 'Stop'

          $config = Get-Content 'input.json' -Raw | ConvertFrom-Json
          $deployment = $config.deployment
          $deploymentPlan = $config.deploymentPlan

          $resourceGroupName = $deployment.resourceGroupName
          $location = $deployment.location

          $moduleMap = [ordered]@{
            nsg = @{
              plan = 'nsgs'
              file = 'modules/networking/nsg.bicep'
            }
            routetable = @{
              plan = 'routeTables'
              file = 'modules/networking/routetable.bicep'
            }
            vnet = @{
              plan = 'vnets'
              file = 'modules/networking/vnet.bicep'
            }
            subnet = @{
              plan = 'subnets'
              file = 'modules/networking/subnet.bicep'
            }
            applicationGatewaySubnet = @{
              plan = 'applicationGatewaySubnets'
              file = 'modules/networking/applicationGatewaySubnet.bicep'
            }
            applicationGateway = @{
              plan = 'applicationGateways'
              file = 'modules/networking/applicationGateway.bicep'
            }
            lb = @{
              plan = 'loadBalancers'
              file = 'modules/loadbalancer/lb.bicep'
            }
            keyvault = @{
              plan = 'keyVaults'
              file = 'modules/security/keyvault.bicep'
            }
            storageAccount = @{
              plan = 'storageAccounts'
              file = 'modules/storage/storageAccount.bicep'
            }
            sql = @{
              plan = 'sqlDatabases'
              file = 'modules/database/sql.bicep'
            }
            openai = @{
              plan = 'openAiServices'
              file = 'modules/ai/openai.bicep'
            }
            vm = @{
              plan = 'vms'
              file = 'modules/compute/vm.bicep'
            }
          }

          foreach ($moduleName in $moduleMap.Keys) {
            $module = $moduleMap[$moduleName]
            $planCategory = $module.plan
            $moduleFile = $module.file

            if ([string]$deploymentPlan.$planCategory -ne 'create') {
              Write-Host "Skipping $moduleName because deployment plan is skip."
              continue
            }

            if (-not (Test-Path $moduleFile)) {
              throw "Bicep module not found: $moduleFile"
            }

            $parameterFiles = Get-ChildItem '.generated-parameters' -File -Filter "$moduleName-*.parameters.json" |
              Sort-Object Name

            if (-not $parameterFiles) {
              Write-Host "No parameters generated for $moduleName. Skipping."
              continue
            }

            foreach ($parameterFile in $parameterFiles) {
              $deploymentName = "pike-$moduleName-$([guid]::NewGuid().ToString('N').Substring(0,8))"

              Write-Host "Deploying module: $moduleName"
              Write-Host "Template: $moduleFile"
              Write-Host "Parameters: $($parameterFile.FullName)"

              az deployment group create `
                --name $deploymentName `
                --resource-group $resourceGroupName `
                --template-file $moduleFile `
                --parameters "@$($parameterFile.FullName)" `
                --output table

              if ($LASTEXITCODE -ne 0) {
                throw "Deployment failed for module: $moduleName"
              }
            }
          }

          Write-Host 'All selected infrastructure modules have been deployed.'

      # --------------------------------------------
      # 12. VERIFY RESOURCE GROUP
      # --------------------------------------------
      - name: Verify deployed resources
        if: steps.config.outputs.deploy_resources == 'true'
        run: |
          $ErrorActionPreference = 'Stop'

          $config = Get-Content 'input.json' -Raw | ConvertFrom-Json
          $resourceGroupName = $config.deployment.resourceGroupName

          az group show `
            --name $resourceGroupName `
            --output table

          if ($LASTEXITCODE -ne 0) {
            throw "Unable to verify Resource Group: $resourceGroupName"
          }

          az resource list `
            --resource-group $resourceGroupName `
            --output table

          if ($LASTEXITCODE -ne 0) {
            throw 'Unable to list deployed resources.'
          }

      # --------------------------------------------
      # 13. CLEANUP GENERATED FILES
      # --------------------------------------------
      - name: Cleanup generated parameter files
        if: always()
        run: |
          $ErrorActionPreference = 'Continue'

          if (Test-Path '.generated-parameters') {
            Remove-Item '.generated-parameters' -Recurse -Force
            Write-Host 'Generated parameter files cleaned up.'
          }
