
name: PIKE-IAC Modular Deployment With SelfHosted Runner

on:
  workflow_dispatch:
    inputs:
      deploy_resources:
        description: "Deploy resources after validation"
        type: boolean
        required: true
        default: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Validate and Deploy Individual Modules
    runs-on: [self-hosted, Windows, X64, pike]

    defaults:
      run:
        shell: powershell

    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      VM_ADMIN_PASSWORD: ${{ secrets.VM_ADMIN_PASSWORD }}
      SQL_ADMIN_PASSWORD: ${{ secrets.SQL_ADMIN_PASSWORD }}

    steps:

      # --------------------------------------------
      # 1. CHECKOUT
      # --------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------
      # 2. DISCOVER AND VERIFY WINDOWS TOOLS
      # --------------------------------------------

      - name: Discover and verify Windows tools
        id: tools
        run: |
          $ErrorActionPreference = "Stop"

          function Add-RunnerPath {
            param([string]$PathToAdd)

            if ([string]::IsNullOrWhiteSpace($PathToAdd)) { return }
            if (-not (Test-Path -LiteralPath $PathToAdd -PathType Container)) { return }

            $normalized = [IO.Path]::GetFullPath($PathToAdd).TrimEnd('\')
            $existing = @($env:PATH -split ';' | ForEach-Object { $_.TrimEnd('\') })

            if ($existing -notcontains $normalized) {
              $env:PATH = "$normalized;$env:PATH"
            }

            $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
            [IO.File]::AppendAllText(
              $env:GITHUB_PATH,
              "$normalized`n",
              $utf8NoBom
            )

            Write-Host "Added to runner PATH: $normalized"
          }

          # Refresh current process with machine PATH.
          $machinePath = [Environment]::GetEnvironmentVariable("Path", "Machine")

          if ($machinePath) {
            foreach ($entry in ($machinePath -split ';')) {
              if ($entry -and (Test-Path -LiteralPath $entry -PathType Container)) {
                Add-RunnerPath $entry
              }
            }
          }

          # Find Windows user profiles.
          $profiles = @()

          if (Test-Path "C:\Users") {
            $profiles = Get-ChildItem "C:\Users" -Directory -ErrorAction SilentlyContinue
          }

          # ----------------------------------------
          # GIT
          # ----------------------------------------

          $gitCandidates = @(
            "$env:ProgramFiles\Git\cmd",
            "$env:ProgramFiles\Git\bin",
            "${env:ProgramFiles(x86)}\Git\cmd",
            "C:\Program Files\Git\cmd"
          )

          foreach ($profile in $profiles) {
            $gitCandidates += Join-Path $profile.FullName "AppData\Local\Programs\Git\cmd"
          }

          foreach ($candidate in $gitCandidates) {
            if ($candidate -and (Test-Path (Join-Path $candidate "git.exe"))) {
              Add-RunnerPath $candidate
              break
            }
          }

          $git = Get-Command git.exe -ErrorAction SilentlyContinue

          if ($git) {
            & $git.Source --version
            if ($LASTEXITCODE -ne 0) { throw "Git verification failed." }
          }
          else {
            Write-Warning "Git CLI not found. Checkout has already completed; deployment steps do not invoke Git."
          }

          # ----------------------------------------
          # AZURE CLI
          # ----------------------------------------

          $azCandidates = @(
            "$env:ProgramFiles\Microsoft SDKs\Azure\CLI2\wbin",
            "${env:ProgramFiles(x86)}\Microsoft SDKs\Azure\CLI2\wbin",
            "C:\Program Files\Microsoft SDKs\Azure\CLI2\wbin",
            "C:\Program Files (x86)\Microsoft SDKs\Azure\CLI2\wbin"
          )

          foreach ($profile in $profiles) {
            $azCandidates += Join-Path $profile.FullName "AppData\Local\Programs\Microsoft SDKs\Azure\CLI2\wbin"
          }

          $azDirectory = $null

          foreach ($candidate in $azCandidates) {
            if ($candidate -and (Test-Path (Join-Path $candidate "az.cmd"))) {
              $azDirectory = $candidate
              break
            }
          }

          if (-not $azDirectory) {
            $azCommand = Get-Command az -ErrorAction SilentlyContinue

            if ($azCommand -and $azCommand.Source) {
              $azDirectory = Split-Path -Parent $azCommand.Source
            }
          }

          if (-not $azDirectory) {
            throw "Azure CLI was not found. Check the Azure CLI installation on the Windows VM."
          }

          Add-RunnerPath $azDirectory

          Write-Host "===== AZURE CLI ====="

          & (Join-Path $azDirectory "az.cmd") version

          if ($LASTEXITCODE -ne 0) {
            throw "Azure CLI verification failed."
          }

          # ----------------------------------------
          # PYTHON
          # ----------------------------------------

          $pythonCandidates = @(
            "$env:ProgramFiles\Python312",
            "$env:ProgramFiles\Python313",
            "C:\Python312",
            "C:\Python313"
          )

          foreach ($profile in $profiles) {
            $pythonRoot = Join-Path $profile.FullName "AppData\Local\Programs\Python"

            if (Test-Path $pythonRoot) {
              $pythonCandidates += Get-ChildItem $pythonRoot -Directory -ErrorAction SilentlyContinue |
                Select-Object -ExpandProperty FullName
            }
          }

          $pythonExe = $null
          $pythonDirectory = $null
          $pythonScripts = $null

          foreach ($candidate in $pythonCandidates) {
            $candidateExe = Join-Path $candidate "python.exe"

            if (Test-Path $candidateExe) {
              $pythonExe = $candidateExe
              $pythonDirectory = $candidate
              $pythonScripts = Join-Path $candidate "Scripts"
              break
            }
          }

          if (-not $pythonExe) {
            $pythonCommand = Get-Command python.exe -ErrorAction SilentlyContinue

            if ($pythonCommand) {
              $pythonExe = $pythonCommand.Source
              $pythonDirectory = Split-Path -Parent $pythonExe
              $pythonScripts = Join-Path $pythonDirectory "Scripts"
            }
          }

          if (-not $pythonExe) {
            throw "Python was not found. Install Python 3.12 or add its installation directory to PATH."
          }

          Add-RunnerPath $pythonDirectory
          Add-RunnerPath $pythonScripts

          Write-Host "===== PYTHON ====="

          & $pythonExe --version

          if ($LASTEXITCODE -ne 0) {
            throw "Python verification failed."
          }

          # ----------------------------------------
          # JQ
          # ----------------------------------------

          $jqCandidates = @(
            "$env:ProgramFiles\jq",
            "C:\ProgramData\chocolatey\bin",
            "C:\tools",
            "C:\Windows\System32"
          )

          foreach ($profile in $profiles) {
            $jqCandidates += Join-Path $profile.FullName "AppData\Local\Microsoft\WinGet\Links"
            $jqCandidates += Join-Path $profile.FullName "scoop\shims"
          }

          $jqDirectory = $null

          foreach ($candidate in $jqCandidates) {
            if ($candidate -and (Test-Path (Join-Path $candidate "jq.exe"))) {
              $jqDirectory = $candidate
              break
            }
          }

          if (-not $jqDirectory) {
            $jqCommand = Get-Command jq.exe -ErrorAction SilentlyContinue

            if ($jqCommand) {
              $jqDirectory = Split-Path -Parent $jqCommand.Source
            }
          }

          if (-not $jqDirectory) {
            throw "jq.exe was not found. Install jq or add its installation directory to PATH."
          }

          Add-RunnerPath $jqDirectory

          Write-Host "===== JQ ====="

          & (Join-Path $jqDirectory "jq.exe") --version

          if ($LASTEXITCODE -ne 0) {
            throw "jq verification failed."
          }

          # ----------------------------------------
          # PIP AND YAMLLINT
          # ----------------------------------------

          & $pythonExe -m pip --version

          if ($LASTEXITCODE -ne 0) {
            & $pythonExe -m ensurepip --upgrade

            if ($LASTEXITCODE -ne 0) {
              throw "Unable to bootstrap pip."
            }
          }

          & $pythonExe -c "import yamllint" 2>$null

          if ($LASTEXITCODE -ne 0) {
            & $pythonExe -m pip install --user yamllint

            if ($LASTEXITCODE -ne 0) {
              throw "Unable to install yamllint."
            }
          }

          & $pythonExe -m yamllint --version

          if ($LASTEXITCODE -ne 0) {
            throw "yamllint verification failed."
          }

          # ----------------------------------------
          # BICEP
          # ----------------------------------------

          & (Join-Path $azDirectory "az.cmd") bicep install

          if ($LASTEXITCODE -ne 0) {
            throw "Bicep installation failed."
          }

          & (Join-Path $azDirectory "az.cmd") bicep version

          if ($LASTEXITCODE -ne 0) {
            throw "Bicep verification failed."
          }

          Write-Host "Windows runner tool discovery and verification passed."

      # --------------------------------------------
      # 3. LINT BICEP MODULES
      # --------------------------------------------

      - name: Lint Bicep modules
        run: |
          $ErrorActionPreference = "Stop"

          $bicepFiles = Get-ChildItem -Path "modules" -Recurse -File -Filter "*.bicep"

          if (-not $bicepFiles) {
            throw "No Bicep files found under modules/."
          }

          foreach ($file in $bicepFiles) {
            Write-Host "Building: $($file.FullName)"

            az bicep build --file $file.FullName --stdout | Out-Null

            if ($LASTEXITCODE -ne 0) {
              throw "Bicep build failed: $($file.FullName)"
            }
          }

          Write-Host "All Bicep modules passed validation."

      # --------------------------------------------
      # 4. VALIDATE JSON AND YAML
      # --------------------------------------------

      - name: Validate JSON
        run: |
          $ErrorActionPreference = "Stop"

          $jsonFiles = Get-ChildItem -Path "." -Recurse -File -Filter "*.json" |
            Where-Object {
              $_.FullName -notmatch '[\\/]\.git[\\/]' -and
              $_.FullName -notmatch '[\\/]\.generated-parameters[\\/]'
            }

          foreach ($file in $jsonFiles) {
            Write-Host "Checking JSON: $($file.FullName)"

            python -c 'import json,sys; json.load(open(sys.argv[1], encoding="utf-8"))' $file.FullName

            if ($LASTEXITCODE -ne 0) {
              throw "Invalid JSON: $($file.FullName)"
            }
          }

          Write-Host "All JSON files are valid."

      - name: Lint GitHub Actions YAML
        run: |
          $ErrorActionPreference = "Stop"

          python -m yamllint -d relaxed .github/workflows/

          if ($LASTEXITCODE -ne 0) {
            throw "GitHub Actions YAML lint failed."
          }

      # --------------------------------------------
      # 5. GENERATE PARAMETERS FROM input.json
      # --------------------------------------------

      - name: Generate module parameters
        id: config
        run: |
          $ErrorActionPreference = "Stop"

          foreach ($secretName in @(
            "AZURE_CLIENT_ID",
            "AZURE_TENANT_ID",
            "AZURE_SUBSCRIPTION_ID"
          )) {
            if ([string]::IsNullOrWhiteSpace(
              [Environment]::GetEnvironmentVariable($secretName)
            )) {
              throw "Required GitHub secret '$secretName' is missing."
            }
          }

          New-Item -ItemType Directory -Force -Path ".generated-parameters" | Out-Null

          $pythonScript = @'
          import json
          import os
          from pathlib import Path

          with open("input.json", encoding="utf-8") as f:
              config = json.load(f)

          with open("config/subscriptions.json", encoding="utf-8") as f:
              subscriptions = json.load(f)

          def check(condition, message):
              if not condition:
                  raise SystemExit(message)

          check(config["request"]["approved"] is True, "Request is not approved.")

          environment = config["request"]["environment"]

          matching = [
              item for item in subscriptions
              if item["environment"] == environment
          ]

          check(len(matching) == 1, f"Expected exactly one subscription for {environment}.")

          registry_subscription = matching[0]["sub_id"]
          actual_subscription = os.environ["AZURE_SUBSCRIPTION_ID"]

          check(
              registry_subscription.lower() == actual_subscription.lower(),
              "GitHub subscription secret does not match config/subscriptions.json."
          )

          zones = config["landingZones"]
          plan = config["deploymentPlan"]
          output = Path(".generated-parameters")

          keys = [
              "resourceGroups",
              "nsgs",
              "routeTables",
              "vnets",
              "subnets",
              "loadBalancers",
              "applicationGatewaySubnets",
              "applicationGateways",
              "keyVaults",
              "storageAccounts",
              "sqlDatabases",
              "openAiServices",
              "vms"
          ]

          for key in keys:
              check(
                  isinstance(zones.get(key), list),
                  f"Invalid or missing configuration: landingZones.{key}"
              )

              check(
                  plan.get(key, "skip") in ("create", "skip"),
                  f"Invalid deployment plan: {key}"
              )

              check(
                  len(zones[key]) <= 1,
                  f"Only one {key} entry is supported per run."
              )

          check(
              len(zones["resourceGroups"]) == 1,
              "Exactly one Resource Group is required."
          )

          rg = zones["resourceGroups"][0]["rgName"]
          location = config["deployment"]["location"]

          check(bool(rg), "Resource Group name is empty.")

          for key in keys:
              for item in zones[key]:
                  if key != "resourceGroups":
                      check(
                          item.get("resourceGroupName") == rg,
                          f"Resource Group mismatch in {key}"
                      )

          check(
              len(zones["vms"]) <= 1 and len(zones["sqlDatabases"]) <= 1,
              "Only one VM and one SQL configuration are supported."
          )

          if plan.get("vms") == "create" and zones["vms"]:
              check(bool(os.environ.get("VM_ADMIN_PASSWORD")), "VM_ADMIN_PASSWORD secret is required.")

          if plan.get("sqlDatabases") == "create" and zones["sqlDatabases"]:
              check(bool(os.environ.get("SQL_ADMIN_PASSWORD")), "SQL_ADMIN_PASSWORD secret is required.")

          def write(name, params):
              data = {
                  "$schema": "https://schema.management.azure.com/schemas/2019-04-01/deploymentParameters.json#",
                  "contentVersion": "1.0.0.0",
                  "parameters": {
                      key: {"value": value}
                      for key, value in params.items()
                  }
              }

              with open(output / f"{name}.json", "w", encoding="utf-8") as f:
                  json.dump(data, f, indent=2)

          # RESOURCE GROUP
          x = zones["resourceGroups"][0]

          write("resourcegroup", {
              "rgname": x["rgName"],
              "location": x["location"],
              "tags": x["tags"]
          })

          # NSG
          for x in zones["nsgs"]:
              write("nsg", {
                  "location": x["location"],
                  "nsgName": x["name"],
                  "securityRules": x["securityRules"],
                  "tags": x["tags"]
              })

          # ROUTE TABLE
          for x in zones["routeTables"]:
              write("routetable", {
                  "routeTableName": x["name"],
                  "location": x["location"],
                  "disableBgpRoutePropagation": x["disableBgpRoutePropagation"],
                  "routes": x["routes"],
                  "tags": x["tags"]
              })

          # VNET
          for x in zones["vnets"]:
              write("vnet", {
                  "location": x["location"],
                  "vnetName": x["name"],
                  "addressPrefixes": x["addressPrefixes"],
                  "tags": x["tags"],
                  "dnsServers": x["dnsServers"],
                  "subnets": []
              })

          # SUBNET
          for x in zones["subnets"]:
              write("subnet", {
                  "vnetName": x["vnetName"],
                  "subnetName": x["name"],
                  "addressPrefix": x["addressPrefix"],
                  "networkSecurityGroupName": x.get("networkSecurityGroupName", ""),
                  "routeTableName": x.get("routeTableName", ""),
                  "serviceEndpoints": x["serviceEndpoints"],
                  "privateEndpointNetworkPolicies": x["privateEndpointNetworkPolicies"],
                  "privateLinkServiceNetworkPolicies": x["privateLinkServiceNetworkPolicies"]
              })

          # APPLICATION GATEWAY SUBNET
          for x in zones["applicationGatewaySubnets"]:
              write("applicationgatewaysubnet", {
                  "vnetName": x["vnetName"],
                  "subnetName": x["subnetName"],
                  "subnetAddressPrefix": x["subnetAddressPrefix"]
              })

          # LOAD BALANCER
          for x in zones["loadBalancers"]:
              write("loadbalancer", {
                  "loadBalancerName": x["name"],
                  "location": x["location"],
                  "skuName": x["skuName"],
                  "skuTier": x["skuTier"],
                  "tags": x["tags"],
                  "vnetName": x["vnetName"],
                  "subnetName": x["subnetName"],
                  "frontends": x["frontends"],
                  "backendPools": x["backendPools"],
                  "probes": x["probes"],
                  "loadBalancingRules": x["loadBalancingRules"]
              })

          # APPLICATION GATEWAY
          for x in zones["applicationGateways"]:
              write("applicationgateway", {
                  "applicationGatewayName": x["applicationGatewayName"],
                  "location": x["location"],
                  "vnetName": x["vnetName"],
                  "subnetName": x["subnetName"],
                  "publicIpName": x["publicIpName"],
                  "privateFrontendIp": x["privateFrontendIp"],
                  "minCapacity": x["minCapacity"],
                  "maxCapacity": x["maxCapacity"],
                  "frontendPorts": x["frontendPorts"],
                  "backendPools": x["backendPools"],
                  "backendHttpSettings": x["backendHttpSettings"],
                  "healthProbes": x["healthProbes"],
                  "listeners": x["listeners"],
                  "routingRules": x["routingRules"],
                  "enableHttp2": x["enableHttp2"],
                  "tags": x["tags"]
              })

          # KEY VAULT
          for x in zones["keyVaults"]:
              write("keyvault", {
                  "keyVaultName": x["name"],
                  "location": x["location"],
                  "tenantId": os.environ["AZURE_TENANT_ID"],
                  "skuName": x["skuName"],
                  "skuFamily": x["skuFamily"],
                  "enableRbacAuthorization": x["enableRbacAuthorization"],
                  "enablePurgeProtection": x["enablePurgeProtection"],
                  "softDeleteRetentionInDays": x["softDeleteRetentionInDays"],
                  "publicNetworkAccess": x["publicNetworkAccess"],
                  "tags": x["tags"]
              })

          # STORAGE
          for x in zones["storageAccounts"]:
              write("storage", {
                  "storageAccountName": x["name"],
                  "location": x["location"],
                  "tags": x["tags"],
                  "skuName": x["skuName"],
                  "kind": x["kind"],
                  "accessTier": x["accessTier"],
                  "minimumTlsVersion": x["minimumTlsVersion"],
                  "supportsHttpsTrafficOnly": x["supportsHttpsTrafficOnly"],
                  "allowBlobPublicAccess": x["allowBlobPublicAccess"],
                  "allowSharedKeyAccess": x["allowSharedKeyAccess"],
                  "publicNetworkAccess": x["publicNetworkAccess"],
                  "containerNames": x["containerNames"],
                  "blobServiceName": x["blobServiceName"],
                  "containerPublicAccess": x["containerPublicAccess"]
              })

          # SQL
          for x in zones["sqlDatabases"]:
              write("sql", {
                  "location": x["location"],
                  "serverName": x["serverName"],
                  "databaseName": x["databaseName"],
                  "administratorLogin": x["administratorLogin"],
                  "administratorLoginPassword": os.environ["SQL_ADMIN_PASSWORD"],
                  "sqlServerVersion": x["sqlServerVersion"],
                  "databaseSkuName": x["databaseSkuName"],
                  "databaseSkuTier": x["databaseSkuTier"],
                  "databaseCapacity": x["databaseCapacity"],
                  "databaseMaxSizeBytes": x["databaseMaxSizeBytes"],
                  "publicNetworkAccess": x["publicNetworkAccess"],
                  "minimumTlsVersion": x["minimumTlsVersion"],
                  "tags": x["tags"]
              })

          # AZURE OPENAI
          for x in zones["openAiServices"]:
              write("openai", {
                  "accountName": x["name"],
                  "location": x["location"],
                  "skuName": x["skuName"],
                  "customSubDomainName": x["customSubDomainName"],
                  "publicNetworkAccess": x["publicNetworkAccess"],
                  "tags": x["tags"]
              })

          # WINDOWS VM
          for x in zones["vms"]:
              write("vm", {
                  "location": x["location"],
                  "computerName": x["computerName"],
                  "vmName": x["name"],
                  "adminUsername": x["adminUsername"],
                  "vmAdminPassword": os.environ["VM_ADMIN_PASSWORD"],
                  "vmSize": x["vmSize"],
                  "tags": x["tags"],
                  "vnetName": x["vnetName"],
                  "subnetName": x["subnetName"],
                  "nicName": x["nicName"],
                  "privateIpAllocationMethod": x["privateIpAllocationMethod"],
                  "imagePublisher": x["imagePublisher"],
                  "imageOffer": x["imageOffer"],
                  "imageSku": x["imageSku"],
                  "imageVersion": x["imageVersion"],
                  "osDiskStorageAccountType": x["osDiskStorageAccountType"],
                  "osDiskCreateOption": x["osDiskCreateOption"],
                  "osDiskSizeGB": x["osDiskSizeGB"],
                  "enableBootDiagnostics": x["enableBootDiagnostics"]
              })

          # GITHUB OUTPUTS
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              f.write(f"RG_NAME={rg}\n")
              f.write(f"LOCATION={location}\n")
              f.write(f"SELECTED_SUBSCRIPTION_ID={registry_subscription}\n")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              for key in keys:
                  f.write(f"{key}={plan.get(key, 'skip')}\n")

          print(f"Environment: {environment}")
          print(f"Resource Group: {rg}")
          print("Subscription registry validation passed.")
          print("All module parameter files generated successfully.")
          '@

          $pythonFile = Join-Path $env:RUNNER_TEMP "generate_parameters.py"
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)

          [IO.File]::WriteAllText($pythonFile, $pythonScript, $utf8NoBom)

          python $pythonFile

          if ($LASTEXITCODE -ne 0) {
            throw "Parameter generation failed."
          }

      # --------------------------------------------
      # 6. AZURE LOGIN - OIDC
      # --------------------------------------------

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # --------------------------------------------
      # 7. VERIFY AZURE SUBSCRIPTION
      # --------------------------------------------

      - name: Verify Azure subscription
        run: |
          $ErrorActionPreference = "Stop"

          az account set --subscription "$env:SELECTED_SUBSCRIPTION_ID"

          if ($LASTEXITCODE -ne 0) {
            throw "Unable to select configured Azure subscription."
          }

          az account show --query "{Name:name,Subscription:id,Tenant:tenantId}" --output table

          if ($LASTEXITCODE -ne 0) {
            throw "Unable to read Azure subscription."
          }

      # --------------------------------------------
      # 8. PRE-DEPLOYMENT RESOURCE CHECKS
      # --------------------------------------------

      - name: Pre-deployment resource checks
        if: inputs.deploy_resources
        env:
          PLAN_RG: ${{ steps.config.outputs.resourceGroups }}
          PLAN_KV: ${{ steps.config.outputs.keyVaults }}
          PLAN_OPENAI: ${{ steps.config.outputs.openAiServices }}
        run: |
          $ErrorActionPreference = "Stop"

          $config = Get-Content -LiteralPath "input.json" -Raw | ConvertFrom-Json

          # RESOURCE GROUP
          $rgExists = (az group exists --name "$env:RG_NAME" --output tsv).Trim()

          if ($LASTEXITCODE -ne 0) {
            throw "Unable to check Resource Group existence."
          }

          if ($rgExists -ne "true" -and $env:PLAN_RG -ne "create") {
            throw "Resource Group '$env:RG_NAME' is missing, but deploymentPlan.resourceGroups is '$env:PLAN_RG'. Set it to create in input.json."
          }

          if ($rgExists -eq "true") {
            Write-Host "PASS: Resource Group exists."
          }
          else {
            Write-Host "PASS: Resource Group will be created."
          }

          # KEY VAULT
          if ($env:PLAN_KV -eq "create" -and $config.landingZones.keyVaults.Count -gt 0) {

            $kvName = [string]$config.landingZones.keyVaults[0].name

            $activeJson = az keyvault list --query "[?name=='$kvName'].{name:name,resourceGroup:resourceGroup}" --output json

            if ($LASTEXITCODE -ne 0) {
              throw "Unable to list active Key Vaults."
            }

            $active = @($activeJson | ConvertFrom-Json)

            if ($active.Count -gt 0) {

              if ($active[0].resourceGroup -ne $env:RG_NAME) {
                throw "Key Vault '$kvName' already exists in Resource Group '$($active[0].resourceGroup)'."
              }

              Write-Host "PASS: Key Vault exists in target Resource Group."
            }
            else {

              $deletedJson = az keyvault list-deleted --query "[?name=='$kvName'].{name:name,location:properties.location}" --output json

              if ($LASTEXITCODE -ne 0) {
                throw "Unable to list soft-deleted Key Vaults."
              }

              $deleted = @($deletedJson | ConvertFrom-Json)

              if ($deleted.Count -gt 0) {
                throw "BLOCKED: Key Vault '$kvName' is soft-deleted. Recover it or resolve its retention/purge-protection state. This workflow will not purge it."
              }

              Write-Host "PASS: No active or soft-deleted Key Vault was found."
            }
          }
          else {
            Write-Host "Key Vault check skipped. Plan: $env:PLAN_KV"
          }

          # AZURE OPENAI
          if ($env:PLAN_OPENAI -eq "create" -and $config.landingZones.openAiServices.Count -gt 0) {

            $openAi = $config.landingZones.openAiServices[0]

            $accountName = [string]$openAi.name
            $subdomainName = [string]$openAi.customSubDomainName

            $accountsJson = az cognitiveservices account list --query "[?name=='$accountName'].{name:name,resourceGroup:resourceGroup,location:location,kind:kind}" --output json

            if ($LASTEXITCODE -ne 0) {
              throw "Unable to list Cognitive Services accounts."
            }

            $accounts = @($accountsJson | ConvertFrom-Json)

            if ($accounts.Count -gt 0) {

              if ($accounts[0].resourceGroup -ne $env:RG_NAME) {
                throw "Azure OpenAI account '$accountName' already exists in Resource Group '$($accounts[0].resourceGroup)'."
              }

              Write-Host "PASS: Azure OpenAI account exists in target Resource Group."
            }
            else {

              $domainUrl = "https://management.azure.com/subscriptions/$env:SELECTED_SUBSCRIPTION_ID/providers/Microsoft.CognitiveServices/checkDomainAvailability?api-version=2017-04-18"

              $body = @{
                subdomainName = $subdomainName
                type = "Microsoft.CognitiveServices/accounts"
              } | ConvertTo-Json -Compress

              $domainJson = az rest --method post --url $domainUrl --body $body

              if ($LASTEXITCODE -ne 0) {
                throw "Azure OpenAI custom subdomain availability check failed."
              }

              $domainResult = $domainJson | ConvertFrom-Json

              if ($domainResult.isSubdomainAvailable -ne $true) {
                throw "Azure OpenAI custom subdomain '$subdomainName' is unavailable. Reason: $($domainResult.reason)"
              }

              Write-Host "PASS: Azure OpenAI account name and custom subdomain are available."
            }
          }
          else {
            Write-Host "Azure OpenAI check skipped. Plan: $env:PLAN_OPENAI"
          }

          Write-Host "All selected pre-deployment checks passed."

      # --------------------------------------------
      # 9. DEPLOY RESOURCE GROUP
      # --------------------------------------------

      - name: Deploy Resource Group
        if: inputs.deploy_resources && steps.config.outputs.resourceGroups == 'create'
        run: |
          $ErrorActionPreference = "Stop"

          az deployment sub create `
            --name "PIKE-RG-${{ github.run_number }}" `
            --location "$env:LOCATION" `
            --template-file "modules/resourcegroup.bicep" `
            --parameters "@.generated-parameters/resourcegroup.json" `
            --output table

          if ($LASTEXITCODE -ne 0) {
            throw "Resource Group deployment failed."
          }

      # --------------------------------------------
      # 10. DEPLOY INDIVIDUAL MODULES
      # --------------------------------------------

      - name: Deploy individual modules
        if: inputs.deploy_resources
        env:
          PLAN_NSG: ${{ steps.config.outputs.nsgs }}
          PLAN_RT: ${{ steps.config.outputs.routeTables }}
          PLAN_VNET: ${{ steps.config.outputs.vnets }}
          PLAN_SUBNET: ${{ steps.config.outputs.subnets }}
          PLAN_LB: ${{ steps.config.outputs.loadBalancers }}
          PLAN_APPGW_SUBNET: ${{ steps.config.outputs.applicationGatewaySubnets }}
          PLAN_APPGW: ${{ steps.config.outputs.applicationGateways }}
          PLAN_KV: ${{ steps.config.outputs.keyVaults }}
          PLAN_STORAGE: ${{ steps.config.outputs.storageAccounts }}
          PLAN_SQL: ${{ steps.config.outputs.sqlDatabases }}
          PLAN_OPENAI: ${{ steps.config.outputs.openAiServices }}
          PLAN_VM: ${{ steps.config.outputs.vms }}
        run: |
          $ErrorActionPreference = "Stop"

          function Deploy-Module {
            param(
              [string]$Plan,
              [string]$Name,
              [string]$Template,
              [string]$ParametersFile
            )

            if ($Plan -eq "create") {

              if (-not (Test-Path -LiteralPath $Template)) {
                throw "Bicep template not found: $Template"
              }

              if (-not (Test-Path -LiteralPath $ParametersFile)) {
                throw "Parameter file not found: $ParametersFile"
              }

              Write-Host "Deploying module: $Name"

              az deployment group create `
                --name "PIKE-$Name-${{ github.run_number }}" `
                --resource-group "$env:RG_NAME" `
                --template-file $Template `
                --parameters "@$ParametersFile" `
                --mode Incremental `
                --output table

              if ($LASTEXITCODE -ne 0) {
                throw "Deployment failed for module: $Name"
              }
            }
            else {
              Write-Host "Skipping module: $Name (plan: $Plan)"
            }
          }

          # NETWORK
          Deploy-Module $env:PLAN_NSG "NSG" "modules/networking/nsg.bicep" ".generated-parameters/nsg.json"

          Deploy-Module $env:PLAN_RT "ROUTE-TABLE" "modules/networking/routetable.bicep" ".generated-parameters/routetable.json"

          Deploy-Module $env:PLAN_VNET "VNET" "modules/networking/vnet.bicep" ".generated-parameters/vnet.json"

          Deploy-Module $env:PLAN_SUBNET "SUBNET" "modules/networking/subnet.bicep" ".generated-parameters/subnet.json"

          # APPLICATION GATEWAY SUBNET
          Deploy-Module $env:PLAN_APPGW_SUBNET "APPLICATION-GATEWAY-SUBNET" "modules/networking/applicationGatewaySubnet.bicep" ".generated-parameters/applicationgatewaysubnet.json"

          # LOAD BALANCER
          Deploy-Module $env:PLAN_LB "LOAD-BALANCER" "modules/loadbalancer/lb.bicep" ".generated-parameters/loadbalancer.json"

          # APPLICATION GATEWAY
          Deploy-Module $env:PLAN_APPGW "APPLICATION-GATEWAY" "modules/networking/applicationGateway.bicep" ".generated-parameters/applicationgateway.json"

          # KEY VAULT
          Deploy-Module $env:PLAN_KV "KEY-VAULT" "modules/security/keyvault.bicep" ".generated-parameters/keyvault.json"

          # STORAGE
          Deploy-Module $env:PLAN_STORAGE "STORAGE" "modules/storage/storageAccount.bicep" ".generated-parameters/storage.json"

          # SQL
          Deploy-Module $env:PLAN_SQL "SQL" "modules/database/sql.bicep" ".generated-parameters/sql.json"

          # OPENAI
          Deploy-Module $env:PLAN_OPENAI "OPENAI" "modules/ai/openai.bicep" ".generated-parameters/openai.json"

          # VM
          Deploy-Module $env:PLAN_VM "VM" "modules/compute/vm.bicep" ".generated-parameters/vm.json"

      # --------------------------------------------
      # 11. VERIFY DEPLOYED RESOURCES
      # --------------------------------------------

      - name: Verify deployed resources
        if: inputs.deploy_resources
        run: |
          $ErrorActionPreference = "Stop"

          az resource list `
            --resource-group "$env:RG_NAME" `
            --query "[].{Name:name,Type:type,Location:location}" `
            --output table

          if ($LASTEXITCODE -ne 0) {
            throw "Unable to list resources in Resource Group '$env:RG_NAME'."
          }

      # --------------------------------------------
      # 12. CLEANUP
      # --------------------------------------------

      - name: Cleanup generated parameters
        if: always()
        run: |
          $ErrorActionPreference = "Continue"

          if (Test-Path -LiteralPath ".generated-parameters") {
            Remove-Item -LiteralPath ".generated-parameters" -Recurse -Force
            Write-Host "Generated parameter files cleaned up."
          }
