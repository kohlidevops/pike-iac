name: PIKE-IAC Deployment

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      RG_NAME: ${{ vars.RESOURCE_GROUP_NAME }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Bicep
        run: |
          az bicep install
          pip install yamllint

      # LINT
      - name: Lint Bicep modules
        shell: bash
        run: |
          set -e
          find modules -name '*.bicep' ! -path 'modules/main.bicep' -print0 |
          while IFS= read -r -d '' file; do
            echo "Linting $file"
            az bicep build --file "$file" --stdout > /dev/null
          done

      - name: Validate JSON
        run: |
          find . -name '*.json' -not -path './.git/*' -print0 |
          while IFS= read -r -d '' file; do
            jq empty "$file"
          done

      - name: Lint YAML
        run: yamllint -d relaxed .github/workflows/

      # READ RESOURCE GROUP ONCE
      - name: Load configuration
        shell: bash
        run: |
          echo "RG_NAME=$(jq -r '.landingZones.resourceGroups[0].rgName' input.json)" >> "$GITHUB_ENV"

      # AZURE LOGIN
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # RESOURCE GROUP
      - name: Deploy Resource Group
        run: |
          az deployment sub create \
            --location centralus \
            --template-file modules/resourcegroup.bicep \
            --parameters @parameters/resourcegroup.json

      # NETWORKING
      - name: Deploy NSG
        run: |
          az deployment group create \
            --resource-group "$RG_NAME" \
            --template-file modules/networking/nsg.bicep \
            --parameters @parameters/nsg.json

      - name: Deploy Route Table
        run: |
          az deployment group create \
            --resource-group "$RG_NAME" \
            --template-file modules/networking/routetable.bicep \
            --parameters @parameters/routetable.json

      - name: Deploy VNet
        run: |
          az deployment group create \
            --resource-group "$RG_NAME" \
            --template-file modules/networking/vnet.bicep \
            --parameters @parameters/vnet.json

      - name: Deploy Subnet
        run: |
          az deployment group create \
            --resource-group "$RG_NAME" \
            --template-file modules/networking/subnet.bicep \
            --parameters @parameters/subnet.json

      # SECURITY
      - name: Deploy Key Vault
        run: |
          az deployment group create \
            --resource-group "$RG_NAME" \
            --template-file modules/security/keyvault.bicep \
            --parameters @parameters/keyvault.json

      # STORAGE
      - name: Deploy Storage Account
        run: |
          az deployment group create \
            --resource-group "$RG_NAME" \
            --template-file modules/storage/storageAccount.bicep \
            --parameters @parameters/storage.json

      # DATABASE
      - name: Deploy SQL
        run: |
          az deployment group create \
            --resource-group "$RG_NAME" \
            --template-file modules/database/sql.bicep \
            --parameters @parameters/sql.json

      # AI
      - name: Deploy Azure OpenAI
        run: |
          az deployment group create \
            --resource-group "$RG_NAME" \
            --template-file modules/ai/openai.bicep \
            --parameters @parameters/openai.json

      # COMPUTE
      - name: Deploy VM
        run: |
          az deployment group create \
            --resource-group "$RG_NAME" \
            --template-file modules/compute/vm.bicep \
            --parameters @parameters/vm.json
