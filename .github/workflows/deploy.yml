name: PIKE-IAC Modular Deployment

on:
  workflow_dispatch:
    inputs:
      deploy_resources:
        description: "Deploy resources after validation"
        type: boolean
        required: true
        default: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Validate and Deploy Individual Modules
    runs-on: ubuntu-latest

    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      VM_ADMIN_PASSWORD: ${{ secrets.VM_ADMIN_PASSWORD }}
      SQL_ADMIN_PASSWORD: ${{ secrets.SQL_ADMIN_PASSWORD }}

    steps:

      # --------------------------------------------
      # 1. CHECKOUT
      # --------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------
      # 2. INSTALL TOOLS
      # --------------------------------------------

      - name: Install tools
        shell: bash
        run: |
          set -euo pipefail
          az bicep install
          pip install yamllint

      # --------------------------------------------
      # 3. LINT ALL BICEP MODULES
      # --------------------------------------------

      - name: Lint Bicep modules
        shell: bash
        run: |
          set -euo pipefail

          find modules -type f -name '*.bicep' -print0 |
          while IFS= read -r -d '' file; do
            echo "Building: $file"
            az bicep build \
              --file "$file" \
              --stdout > /dev/null
          done

      # --------------------------------------------
      # 4. VALIDATE JSON AND YAML
      # --------------------------------------------

      - name: Validate JSON
        shell: bash
        run: |
          set -euo pipefail

          find . -type f -name '*.json' \
            -not -path './.git/*' \
            -print0 |
          while IFS= read -r -d '' file; do
            echo "Checking: $file"
            jq empty "$file"
          done

      - name: Lint GitHub Actions YAML
        shell: bash
        run: |
          set -euo pipefail
          yamllint -d relaxed .github/workflows/

      # --------------------------------------------
      # 5. GENERATE PARAMETERS FROM input.json
      # --------------------------------------------

      - name: Generate module parameters
        id: config
        shell: bash
        run: |
          set -euo pipefail

          test -n "$AZURE_CLIENT_ID"
          test -n "$AZURE_TENANT_ID"
          test -n "$AZURE_SUBSCRIPTION_ID"

          umask 077
          mkdir -p .generated-parameters

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          with open("input.json", encoding="utf-8") as f:
              config = json.load(f)

          with open("config/subscriptions.json", encoding="utf-8") as f:
              subscriptions = json.load(f)

          def check(condition, message):
              if not condition:
                  raise SystemExit(message)

          check(config["request"]["approved"] is True,
                "Request is not approved.")

          environment = config["request"]["environment"]

          matching = [
              item for item in subscriptions
              if item["environment"] == environment
          ]

          check(len(matching) == 1,
                f"Expected exactly one subscription for {environment}.")

          registry_subscription = matching[0]["sub_id"]
          actual_subscription = os.environ["AZURE_SUBSCRIPTION_ID"]

          check(
              registry_subscription.lower() ==
              actual_subscription.lower(),
              "GitHub subscription secret does not match "
              "config/subscriptions.json."
          )

          zones = config["landingZones"]
          plan = config["deploymentPlan"]
          output = Path(".generated-parameters")

          keys = [
              "resourceGroups",
              "nsgs",
              "routeTables",
              "vnets",
              "subnets",
              "loadBalancers",
              "keyVaults",
              "storageAccounts",
              "sqlDatabases",
              "openAiServices",
              "vms"
          ]

          for key in keys:
              check(isinstance(zones.get(key), list),
                    f"Invalid or missing configuration: landingZones.{key}")

              check(plan.get(key, "skip") in ("create", "skip"),
                    f"Invalid deployment plan: {key}")

              check(len(zones[key]) <= 1,
                    f"Only one {key} entry is supported per run.")

          check(len(zones["resourceGroups"]) == 1,
                "Exactly one Resource Group is required.")

          rg = zones["resourceGroups"][0]["rgName"]
          location = config["deployment"]["location"]

          check(bool(rg), "Resource Group name is empty.")

          for key in keys:
              for item in zones[key]:
                  if key != "resourceGroups":
                      check(
                          item.get("resourceGroupName") == rg,
                          f"Resource Group mismatch in {key}"
                      )

          check(
              len(zones["vms"]) <= 1 and
              len(zones["sqlDatabases"]) <= 1,
              "Only one VM and one SQL configuration are supported."
          )

          def write(name, params):
              data = {
                  "$schema":
                    "https://schema.management.azure.com/schemas/2019-04-01/deploymentParameters.json#",
                  "contentVersion": "1.0.0.0",
                  "parameters": {
                      key: {"value": value}
                      for key, value in params.items()
                  }
              }

              with open(output / f"{name}.json", "w",
                        encoding="utf-8") as f:
                  json.dump(data, f, indent=2)

          # Resource Group

          x = zones["resourceGroups"][0]

          write("resourcegroup", {
              "rgname": x["rgName"],
              "location": x["location"],
              "tags": x["tags"]
          })

          # NSG

          for x in zones["nsgs"]:
              write("nsg", {
                  "location": x["location"],
                  "nsgName": x["name"],
                  "securityRules": x["securityRules"],
                  "tags": x["tags"]
              })

          # Route Table

          for x in zones["routeTables"]:
              write("routetable", {
                  "routeTableName": x["name"],
                  "location": x["location"],
                  "disableBgpRoutePropagation":
                    x["disableBgpRoutePropagation"],
                  "routes": x["routes"],
                  "tags": x["tags"]
              })

          # VNet
          # Subnets are deployed separately.

          for x in zones["vnets"]:
              write("vnet", {
                  "location": x["location"],
                  "vnetName": x["name"],
                  "addressPrefixes": x["addressPrefixes"],
                  "tags": x["tags"],
                  "dnsServers": x["dnsServers"],
                  "subnets": []
              })

          # Subnet

          for x in zones["subnets"]:
              write("subnet", {
                  "vnetName": x["vnetName"],
                  "subnetName": x["name"],
                  "addressPrefix": x["addressPrefix"],
                  "networkSecurityGroupName":
                    x.get("networkSecurityGroupName", ""),
                  "routeTableName":
                    x.get("routeTableName", ""),
                  "serviceEndpoints": x["serviceEndpoints"],
                  "privateEndpointNetworkPolicies":
                    x["privateEndpointNetworkPolicies"],
                  "privateLinkServiceNetworkPolicies":
                    x["privateLinkServiceNetworkPolicies"]
              })

          # Load Balancer

          for x in zones["loadBalancers"]:
              write("loadbalancer", {
                  "loadBalancerName": x["name"],
                  "location": x["location"],
                  "skuName": x["skuName"],
                  "skuTier": x["skuTier"],
                  "tags": x["tags"],
                  "vnetName": x["vnetName"],
                  "subnetName": x["subnetName"],
                  "frontends": x["frontends"],
                  "backendPools": x["backendPools"],
                  "probes": x["probes"],
                  "loadBalancingRules": x["loadBalancingRules"]
              })

          # Key Vault

          for x in zones["keyVaults"]:
              write("keyvault", {
                  "keyVaultName": x["name"],
                  "location": x["location"],
                  "tenantId": os.environ["AZURE_TENANT_ID"],
                  "skuName": x["skuName"],
                  "skuFamily": x["skuFamily"],
                  "enableRbacAuthorization":
                    x["enableRbacAuthorization"],
                  "enablePurgeProtection":
                    x["enablePurgeProtection"],
                  "softDeleteRetentionInDays":
                    x["softDeleteRetentionInDays"],
                  "publicNetworkAccess": x["publicNetworkAccess"],
                  "tags": x["tags"]
              })

          # Storage Account

          for x in zones["storageAccounts"]:
              write("storage", {
                  "storageAccountName": x["name"],
                  "location": x["location"],
                  "tags": x["tags"],
                  "skuName": x["skuName"],
                  "kind": x["kind"],
                  "accessTier": x["accessTier"],
                  "minimumTlsVersion": x["minimumTlsVersion"],
                  "supportsHttpsTrafficOnly":
                    x["supportsHttpsTrafficOnly"],
                  "allowBlobPublicAccess":
                    x["allowBlobPublicAccess"],
                  "allowSharedKeyAccess":
                    x["allowSharedKeyAccess"],
                  "publicNetworkAccess": x["publicNetworkAccess"],
                  "containerNames": x["containerNames"],
                  "blobServiceName": x["blobServiceName"],
                  "containerPublicAccess": x["containerPublicAccess"]
              })

          # SQL

          for x in zones["sqlDatabases"]:
              write("sql", {
                  "location": x["location"],
                  "serverName": x["serverName"],
                  "databaseName": x["databaseName"],
                  "administratorLogin": x["administratorLogin"],
                  "administratorLoginPassword":
                    os.environ["SQL_ADMIN_PASSWORD"],
                  "sqlServerVersion": x["sqlServerVersion"],
                  "databaseSkuName": x["databaseSkuName"],
                  "databaseSkuTier": x["databaseSkuTier"],
                  "databaseCapacity": x["databaseCapacity"],
                  "databaseMaxSizeBytes": x["databaseMaxSizeBytes"],
                  "publicNetworkAccess": x["publicNetworkAccess"],
                  "minimumTlsVersion": x["minimumTlsVersion"],
                  "tags": x["tags"]
              })

          # Azure OpenAI

          for x in zones["openAiServices"]:
              write("openai", {
                  "accountName": x["name"],
                  "location": x["location"],
                  "skuName": x["skuName"],
                  "customSubDomainName": x["customSubDomainName"],
                  "publicNetworkAccess": x["publicNetworkAccess"],
                  "tags": x["tags"]
              })

          # Windows VM

          for x in zones["vms"]:
              write("vm", {
                  "location": x["location"],
                  "computerName": x["computerName"],
                  "vmName": x["name"],
                  "adminUsername": x["adminUsername"],
                  "vmAdminPassword":
                    os.environ["VM_ADMIN_PASSWORD"],
                  "vmSize": x["vmSize"],
                  "tags": x["tags"],
                  "vnetName": x["vnetName"],
                  "subnetName": x["subnetName"],
                  "nicName": x["nicName"],
                  "privateIpAllocationMethod":
                    x["privateIpAllocationMethod"],
                  "imagePublisher": x["imagePublisher"],
                  "imageOffer": x["imageOffer"],
                  "imageSku": x["imageSku"],
                  "imageVersion": x["imageVersion"],
                  "osDiskStorageAccountType":
                    x["osDiskStorageAccountType"],
                  "osDiskCreateOption": x["osDiskCreateOption"],
                  "osDiskSizeGB": x["osDiskSizeGB"],
                  "enableBootDiagnostics": x["enableBootDiagnostics"]
              })

          # Share Resource Group and deployment plan

          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"RG_NAME={rg}\n")
              f.write(f"LOCATION={location}\n")
              f.write(f"SELECTED_SUBSCRIPTION_ID={registry_subscription}\n")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              for key in keys:
                  f.write(f"{key}={plan.get(key, 'skip')}\n")

          print(f"Environment: {environment}")
          print(f"Subscription registry validation passed.")
          print("All module parameter files generated successfully.")
          PY

      # --------------------------------------------
      # 6. AZURE LOGIN
      # --------------------------------------------

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # --------------------------------------------
      # 7. VERIFY SUBSCRIPTION
      # --------------------------------------------

      - name: Verify Azure subscription
        shell: bash
        run: |
          set -euo pipefail

          az account set \
            --subscription "$SELECTED_SUBSCRIPTION_ID"

          az account show \
            --query "{Name:name,Subscription:id,Tenant:tenantId}" \
            --output table

      # --------------------------------------------
      # 8. RESOURCE GROUP
      # --------------------------------------------

      - name: Deploy Resource Group
        if: inputs.deploy_resources && steps.config.outputs.resourceGroups == 'create'
        shell: bash
        run: |
          set -euo pipefail

          az deployment sub create \
            --name "PIKE-RG-${{ github.run_number }}" \
            --location "$LOCATION" \
            --template-file modules/resourcegroup.bicep \
            --parameters @.generated-parameters/resourcegroup.json \
            --output table

      # --------------------------------------------
      # 9. DEPLOY INDIVIDUAL MODULES
      # --------------------------------------------

      - name: Deploy individual modules
        if: inputs.deploy_resources
        shell: bash
        env:
          PLAN_NSG: ${{ steps.config.outputs.nsgs }}
          PLAN_RT: ${{ steps.config.outputs.routeTables }}
          PLAN_VNET: ${{ steps.config.outputs.vnets }}
          PLAN_SUBNET: ${{ steps.config.outputs.subnets }}
          PLAN_LB: ${{ steps.config.outputs.loadBalancers }}
          PLAN_KV: ${{ steps.config.outputs.keyVaults }}
          PLAN_STORAGE: ${{ steps.config.outputs.storageAccounts }}
          PLAN_SQL: ${{ steps.config.outputs.sqlDatabases }}
          PLAN_OPENAI: ${{ steps.config.outputs.openAiServices }}
          PLAN_VM: ${{ steps.config.outputs.vms }}
        run: |
          set -euo pipefail

          deploy_module() {
            local plan="$1"
            local name="$2"
            local template="$3"
            local params="$4"

            if [[ "$plan" == "create" ]]; then
              echo "Deploying module: $name"

              az deployment group create \
                --name "PIKE-${name}-${{ github.run_number }}" \
                --resource-group "$RG_NAME" \
                --template-file "$template" \
                --parameters "@$params" \
                --mode Incremental \
                --output table
            else
              echo "Skipping module: $name"
            fi
          }

          # Network

          deploy_module "$PLAN_NSG" \
            "NSG" \
            "modules/networking/nsg.bicep" \
            ".generated-parameters/nsg.json"

          deploy_module "$PLAN_RT" \
            "ROUTE-TABLE" \
            "modules/networking/routetable.bicep" \
            ".generated-parameters/routetable.json"

          deploy_module "$PLAN_VNET" \
            "VNET" \
            "modules/networking/vnet.bicep" \
            ".generated-parameters/vnet.json"

          deploy_module "$PLAN_SUBNET" \
            "SUBNET" \
            "modules/networking/subnet.bicep" \
            ".generated-parameters/subnet.json"

          # Load Balancer

          deploy_module "$PLAN_LB" \
            "LOAD-BALANCER" \
            "modules/loadbalancer/lb.bicep" \
            ".generated-parameters/loadbalancer.json"

          # Security

          deploy_module "$PLAN_KV" \
            "KEY-VAULT" \
            "modules/security/keyvault.bicep" \
            ".generated-parameters/keyvault.json"

          # Storage

          deploy_module "$PLAN_STORAGE" \
            "STORAGE" \
            "modules/storage/storageAccount.bicep" \
            ".generated-parameters/storage.json"

          # Database

          deploy_module "$PLAN_SQL" \
            "SQL" \
            "modules/database/sql.bicep" \
            ".generated-parameters/sql.json"

          # AI

          deploy_module "$PLAN_OPENAI" \
            "OPENAI" \
            "modules/ai/openai.bicep" \
            ".generated-parameters/openai.json"

          # Compute

          deploy_module "$PLAN_VM" \
            "VM" \
            "modules/compute/vm.bicep" \
            ".generated-parameters/vm.json"

      # --------------------------------------------
      # 10. VERIFY DEPLOYED RESOURCES
      # --------------------------------------------

      - name: Verify deployed resources
        if: inputs.deploy_resources
        shell: bash
        run: |
          set -euo pipefail

          az resource list \
            --resource-group "$RG_NAME" \
            --query "[].{Name:name,Type:type,Location:location}" \
            --output table

      # --------------------------------------------
      # 11. CLEANUP
      # --------------------------------------------

      - name: Cleanup generated parameters
        if: always()
        shell: bash
        run: rm -rf .generated-parameters
