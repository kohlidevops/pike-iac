name: Deploy EaaS Dev - Reusable Bicep Library

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Create/update the Dev resource group and deploy resources after reviewing What-If'
        required: true
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

concurrency:
  group: eaas-dev-rg-test-dev
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, Validate, Scan, What-If and Deploy
    runs-on: [self-hosted, Linux, X64, pike]
    env:
      LOCATION: centralus
      PARAM_FILE: eaas-azure-modules/dev.bicepparam
      TEMPLATE_FILE: eaas-azure-modules/main.bicep
      VM_ADMIN_PASSWORD: ${{ secrets.VM_ADMIN_PASSWORD }}
      SQL_ADMIN_PASSWORD: ${{ secrets.SQL_ADMIN_PASSWORD }}
      RBAC_PRINCIPAL_ID: ${{ secrets.RBAC_PRINCIPAL_ID }}
      RBAC_PRINCIPAL_TYPE: ${{ secrets.RBAC_PRINCIPAL_TYPE }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Azure Login with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Azure Context and Required Inputs
        shell: bash
        run: |
          set -euo pipefail
          az account show --query '{Subscription:name,SubscriptionId:id,TenantId:tenantId}' -o table
          test -f "$PARAM_FILE"
          test -f "$TEMPLATE_FILE"
          test -n "$VM_ADMIN_PASSWORD" || { echo 'VM_ADMIN_PASSWORD is missing'; exit 1; }
          test -n "$SQL_ADMIN_PASSWORD" || { echo 'SQL_ADMIN_PASSWORD is missing'; exit 1; }
          test -n "$RBAC_PRINCIPAL_ID" || { echo 'RBAC_PRINCIPAL_ID is missing'; exit 1; }
          test -n "$RBAC_PRINCIPAL_TYPE" || { echo 'RBAC_PRINCIPAL_TYPE is missing'; exit 1; }
          echo 'Template, parameter file, Azure context, and required inputs are present.'

      - name: Build All Bicep Modules
        shell: bash
        run: |
          set -euo pipefail
          find eaas-azure-modules -type f -name '*.bicep' -print0 | while IFS= read -r -d '' file; do
            echo "Building $file"
            az bicep build --file "$file" --outfile "$RUNNER_TEMP/$(basename "$(dirname "$file")")-$(basename "$file" .bicep).json"
          done

      - name: Lint Root Bicep Template
        shell: bash
        run: |
          set -euo pipefail
          az bicep lint --file "$TEMPLATE_FILE"

      - name: Security Scan - Checkov
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/checkov-venv"
          "$RUNNER_TEMP/checkov-venv/bin/pip" install --disable-pip-version-check checkov
          "$RUNNER_TEMP/checkov-venv/bin/checkov" --directory eaas-azure-modules --framework bicep --quiet

      - name: Secret Scan - Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          GITLEAKS_VERSION='8.24.3'
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks" gitleaks
          "$RUNNER_TEMP/gitleaks/gitleaks" detect --source . --redact --exit-code 1 --no-banner

      - name: Validate Subscription Deployment
        shell: bash
        run: |
          set -euo pipefail
          az deployment sub validate \
            --name "eaas-dev-validate-${GITHUB_RUN_NUMBER}" \
            --location "$LOCATION" \
            --template-file "$TEMPLATE_FILE" \
            --parameters "$PARAM_FILE" \
            --output table

      - name: Preview Changes - What If
        shell: bash
        run: |
          set -euo pipefail
          az deployment sub what-if \
            --name "eaas-dev-whatif-${GITHUB_RUN_NUMBER}" \
            --location "$LOCATION" \
            --template-file "$TEMPLATE_FILE" \
            --parameters "$PARAM_FILE" \
            --result-format FullResourcePayloads

      - name: Deploy Resource Group and Resources
        if: ${{ inputs.deploy }}
        shell: bash
        run: |
          set -euo pipefail
          az deployment sub create \
            --name "eaas-dev-${GITHUB_RUN_NUMBER}" \
            --location "$LOCATION" \
            --template-file "$TEMPLATE_FILE" \
            --parameters "$PARAM_FILE" \
            --query properties.provisioningState \
            --output tsv

      - name: Deployment Skipped
        if: ${{ !inputs.deploy }}
        shell: bash
        run: |
          echo 'Deployment skipped. Review validation and What-If output, then rerun with deploy=true.'
