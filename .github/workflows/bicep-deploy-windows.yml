name: Deploy Pike Bicep Modules

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy resources after reviewing What-If"
        required: true
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

jobs:
  lint:
    name: Lint and Validate Bicep
    runs-on: [self-hosted, X64, Windows]
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure and Verify Azure CLI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $azDir = "C:\Program Files\Microsoft SDKs\Azure\CLI2\wbin"
          $az = Join-Path $azDir "az.cmd"

          if (!(Test-Path $az)) {
            throw "Azure CLI not found at $az"
          }

          Add-Content -Path $env:GITHUB_PATH -Value $azDir

          & $az version
          if ($LASTEXITCODE -ne 0) {
            throw "Azure CLI verification failed."
          }

      - name: Validate required files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          foreach ($file in @("main.bicep", "main.bicepparam")) {
            if (!(Test-Path $file)) {
              throw "$file was not found in the repository root."
            }
          }

      - name: Create temporary Bicep lint configuration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $config = @'
          {
            "analyzers": {
              "core": {
                "enabled": true,
                "verbose": true,
                "rules": {
                  "adminusername-should-not-be-literal": {
                    "level": "error"
                  },
                  "artifacts-parameters": {
                    "level": "warning"
                  },
                  "no-hardcoded-env-urls": {
                    "level": "error"
                  },
                  "no-interpolation-in-variables": {
                    "level": "warning"
                  },
                  "no-unused-params": {
                    "level": "error"
                  },
                  "no-unused-vars": {
                    "level": "error"
                  },
                  "prefer-interpolation": {
                    "level": "warning"
                  },
                  "prefer-unquoted-property-names": {
                    "level": "warning"
                  },
                  "simplify-interpolation": {
                    "level": "warning"
                  },
                  "use-parent-property": {
                    "level": "warning"
                  },
                  "use-resource-id-functions": {
                    "level": "warning"
                  }
                }
              }
            }
          }
          '@

          Set-Content -Path "bicepconfig.json" -Value $config -Encoding utf8

          Write-Host "Temporary Bicep lint configuration created."

      - name: Build Bicep template
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $az = "C:\Program Files\Microsoft SDKs\Azure\CLI2\wbin\az.cmd"

          & $az bicep build --file main.bicep

          if ($LASTEXITCODE -ne 0) {
            throw "Bicep build failed."
          }

      - name: Lint Bicep template
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $az = "C:\Program Files\Microsoft SDKs\Azure\CLI2\wbin\az.cmd"

          if (!(Test-Path "bicepconfig.json")) {
            throw "Temporary bicepconfig.json was not created."
          }

          & $az bicep lint --file main.bicep

          if ($LASTEXITCODE -ne 0) {
            throw "Bicep lint failed. Fix the reported errors before deployment."
          }

      - name: Validate Bicep parameter file
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $az = "C:\Program Files\Microsoft SDKs\Azure\CLI2\wbin\az.cmd"

          & $az bicep build-params --file main.bicepparam

          if ($LASTEXITCODE -ne 0) {
            throw "Bicep parameter-file validation failed."
          }

      - name: Remove temporary lint configuration
        if: ${{ always() }}
        shell: pwsh
        run: |
          if (Test-Path "bicepconfig.json") {
            Remove-Item "bicepconfig.json" -Force
            Write-Host "Temporary Bicep lint configuration removed."
          }

  deploy:
    name: What-If and Deploy Bicep
    runs-on: [self-hosted, X64, Windows]
    needs: lint
    timeout-minutes: 60
    environment: dev

    env:
      AZURE_LOCATION: centralus
      AZURE_RESOURCE_GROUP_DEV: ${{ vars.AZURE_RESOURCE_GROUP_DEV }}
      VM_ADMIN_PASSWORD: ${{ secrets.VM_ADMIN_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure and Verify Azure CLI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $azDir = "C:\Program Files\Microsoft SDKs\Azure\CLI2\wbin"
          $az = Join-Path $azDir "az.cmd"

          if (!(Test-Path $az)) {
            throw "Azure CLI not found at $az"
          }

          Add-Content -Path $env:GITHUB_PATH -Value $azDir

          & $az version
          if ($LASTEXITCODE -ne 0) {
            throw "Azure CLI verification failed."
          }

      - name: Validate deployment configuration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:AZURE_RESOURCE_GROUP_DEV)) {
            throw "Create the GitHub repository variable AZURE_RESOURCE_GROUP_DEV."
          }

          if ([string]::IsNullOrWhiteSpace($env:VM_ADMIN_PASSWORD)) {
            throw "GitHub secret VM_ADMIN_PASSWORD is missing."
          }

          if (!(Test-Path "main.bicep")) {
            throw "main.bicep was not found."
          }

          if (!(Test-Path "main.bicepparam")) {
            throw "main.bicepparam was not found."
          }

      - name: Azure Login using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Azure subscription
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $az = "C:\Program Files\Microsoft SDKs\Azure\CLI2\wbin\az.cmd"

          & $az account show --output table

          if ($LASTEXITCODE -ne 0) {
            throw "Azure subscription verification failed."
          }

      - name: Create Resource Group if Needed
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $az = "C:\Program Files\Microsoft SDKs\Azure\CLI2\wbin\az.cmd"

          & $az group create `
            --name "$env:AZURE_RESOURCE_GROUP_DEV" `
            --location "$env:AZURE_LOCATION" `
            --output table

          if ($LASTEXITCODE -ne 0) {
            throw "Resource group creation or verification failed."
          }

      - name: Bicep What-If Preview
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $az = "C:\Program Files\Microsoft SDKs\Azure\CLI2\wbin\az.cmd"

          & $az deployment group what-if `
            --resource-group "$env:AZURE_RESOURCE_GROUP_DEV" `
            --template-file main.bicep `
            --parameters main.bicepparam `
            --output json

          if ($LASTEXITCODE -ne 0) {
            throw "Bicep What-If preview failed."
          }

      - name: Deploy Bicep Modules
        if: ${{ inputs.deploy == true }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $az = "C:\Program Files\Microsoft SDKs\Azure\CLI2\wbin\az.cmd"

          & $az deployment group create `
            --name "pike-deployment-${{ github.run_number }}" `
            --resource-group "$env:AZURE_RESOURCE_GROUP_DEV" `
            --template-file main.bicep `
            --parameters main.bicepparam `
            --output table

          if ($LASTEXITCODE -ne 0) {
            throw "Bicep deployment failed."
          }

      - name: Deployment skipped
        if: ${{ inputs.deploy == false }}
        shell: pwsh
        run: |
          Write-Host "What-If completed. Deployment was not requested."
          Write-Host "Run the workflow again with Deploy enabled to deploy resources."
