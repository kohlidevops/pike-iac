
name: bicep-deploy-windows

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy after What-If succeeds'
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: bicep-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    runs-on: [self-hosted, X64, Windows]
    timeout-minutes: 45

    env:
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_LOCATION: centralus
      VM_ADMIN_PASSWORD: ${{ secrets.VM_ADMIN_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Azure CLI
        shell: pwsh
        run: az version

      - name: Compile root Bicep template
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          az bicep build --file main.bicep
          if ($LASTEXITCODE -ne 0) {
            throw 'Root Bicep build failed.'
          }

      - name: Azure login using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Validate inputs and create resource group
        shell: pwsh
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP_DEV }}
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:AZURE_SUBSCRIPTION_ID)) {
            throw 'Missing repository secret AZURE_SUBSCRIPTION_ID.'
          }

          if ([string]::IsNullOrWhiteSpace($env:RESOURCE_GROUP)) {
            throw 'Create repository variable AZURE_RESOURCE_GROUP_DEV.'
          }

          if ([string]::IsNullOrWhiteSpace($env:VM_ADMIN_PASSWORD)) {
            throw 'Missing repository secret VM_ADMIN_PASSWORD.'
          }

          az account set --subscription $env:AZURE_SUBSCRIPTION_ID
          if ($LASTEXITCODE -ne 0) {
            throw 'Unable to select Azure subscription.'
          }

          az group create `
            --name $env:RESOURCE_GROUP `
            --location $env:AZURE_LOCATION `
            --output none

          if ($LASTEXITCODE -ne 0) {
            throw 'Failed to create or verify resource group.'
          }

      - name: What-If deployment
        shell: pwsh
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP_DEV }}
        run: |
          $ErrorActionPreference = 'Stop'

          az deployment group what-if `
            --name "pike-main-$env:GITHUB_RUN_NUMBER" `
            --resource-group $env:RESOURCE_GROUP `
            --template-file main.bicep `
            --parameters main.bicepparam

          if ($LASTEXITCODE -ne 0) {
            throw 'What-If failed. Deployment was not started.'
          }

      - name: Deploy infrastructure
        if: ${{ inputs.deploy == true }}
        shell: pwsh
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP_DEV }}
        run: |
          $ErrorActionPreference = 'Stop'

          az deployment group create `
            --name "pike-main-$env:GITHUB_RUN_NUMBER" `
            --resource-group $env:RESOURCE_GROUP `
            --template-file main.bicep `
            --parameters main.bicepparam

          if ($LASTEXITCODE -ne 0) {
            throw 'Azure deployment failed.'
          }

      - name: Clear sensitive environment variable
        if: always()
        shell: pwsh
        run: |
          Remove-Item Env:VM_ADMIN_PASSWORD -ErrorAction SilentlyContinue
