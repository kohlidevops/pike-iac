name: Azure OIDC Test

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  azure-login:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Identify Azure App Registration
        shell: bash
        run: |
          if [ "${{ secrets.AZURE_CLIENT_ID }}" = "414196ef-b317-4ce3-8942-489319fd550d" ]; then
            echo "Using App Registration: 414196ef-b317-4ce3-8942-489319fd550d"
            echo "Service Principal Object ID: b9662bdd-9f02-46d3-9981-61b5af7b3c00"
          elif [ "${{ secrets.AZURE_CLIENT_ID }}" = "a968c09f-b9ed-4d56-a184-08ba6bd78c3f" ]; then
            echo "Using App Registration: a968c09f-b9ed-4d56-a184-08ba6bd78c3f"
            echo "Service Principal Object ID: 7af72e07-cb2d-4b22-977a-d9a75eecfa56"
          else
            echo "AZURE_CLIENT_ID does not match either known App Registration"
            exit 1
          fi

      - name: Verify Azure Login
        uses: azure/cli@v2
        with:
          inlineScript: |
            az account show
